name: Container image

# Builds container/Dockerfile and publishes ghcr.io/kgerhardt/tesorter2.
# Runs on every version tag (v2.0.1 -> :2.0.1, :2.0 and :latest), or by hand
# from the Actions tab for an existing tag (e.g. v2.0.0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v2.0.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kgerhardt/tesorter2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: |
          docker run --rm ${{ env.IMAGE }}:latest TEsorter2 -v
          docker run --rm ${{ env.IMAGE }}:latest TEsorter --help > /dev/null
          docker run --rm ${{ env.IMAGE }}:latest bathsearch -h > /dev/null
